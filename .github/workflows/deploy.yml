name: Deploy to cPanel

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Upload built assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: "public/build"
          target: "/home/gfpfypph/repositories/portfolio/public/"
          strip_components: 1
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            PHP=/opt/cpanel/ea-php83/root/usr/bin/php
            APP=/home/gfpfypph/repositories/portfolio
            WEB=/home/gfpfypph/public_html

            # Pick whichever Composer exists on the server
            if [ -x "$HOME/bin/composer" ]; then
              COMPOSER="$HOME/bin/composer"
            elif [ -f "$HOME/composer.phar" ]; then
              COMPOSER="$PHP $HOME/composer.phar"
            else
              COMPOSER="$PHP /opt/cpanel/composer/bin/composer"
            fi

            cd $APP
            git pull origin master
            git fetch origin master
            git reset --hard origin/master

            $COMPOSER install --no-dev --optimize-autoloader --no-interaction

            $PHP artisan config:clear
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan view:cache

            # Copy public/ into public_html, keeping your edited index.php
            rm -rf $WEB/build
            tar --exclude='./index.php' -cf - -C $APP/public . | tar -xf - -C $WEB
